name: Python

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Lint and Test
    runs-on: codeberg-tiny-lazy

    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        run: pip install uv

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format check
        run: uvx ruff format --check .